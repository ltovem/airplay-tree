name: CI Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 桌面三件套（本地原生构建 + 示例构建）
  # ------------------------------------------------------------------
  desktop:
    name: ${{ matrix.config.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        config:
          - name: macOS (AppleClang)
            os: macos-latest
            cc: clang
            cxx: clang++
            examples: ON
            cmake_extra: ''

          - name: Ubuntu (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            examples: ON
            cmake_extra: '-DAIRPLAY2_USE_AVAHI=0'

          - name: Windows (MSVC x64)
            os: windows-latest
            cc: ''
            cxx: ''
            examples: ON
            # 不硬编码 -G "Visual Studio 17 2022"：windows-latest 镜像可能升级到 VS 2025，
            # 硬编码会导致 "could not find any instance of Visual Studio"。
            # 只指定 -A x64，CMake 会自动选择 runner 上已安装的最新 VS 生成器。
            cmake_extra: '-A x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake ninja-build \
              libavahi-client-dev libavahi-common-dev || true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja || true

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ matrix.config.cc }}" ];  then export CC=${{ matrix.config.cc }};  fi
          if [ -n "${{ matrix.config.cxx }}" ]; then export CXX=${{ matrix.config.cxx }}; fi
          cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DAIRPLAY2_BUILD_EXAMPLES=${{ matrix.config.examples }} \
              -DCMAKE_INSTALL_PREFIX=build/install \
              ${{ matrix.config.cmake_extra }}

      - name: Build
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.build_type }} --parallel 3 2>&1 | tee build-log.txt

      - name: Install (package verification)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cmake --install build --config ${{ matrix.build_type }} || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.config.name }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airplay2lib-${{ matrix.config.name }}-${{ matrix.build_type }}
          path: |
            build/libairplay2*
            build/airplay2*
            build/examples/airplay2*
            build/install/**
            build/**/*.lib
            build/**/*.dll
            build/**/*.exe
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # iOS 交叉构建（真机 arm64 + 模拟器 x86_64 / arm64）
  # ------------------------------------------------------------------
  ios:
    name: iOS ${{ matrix.sdk.platform }} (${{ matrix.sdk.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - { platform: 'OS',         arch: 'arm64',    sdk: 'iphoneos',       deploy: '12.0' }
          - { platform: 'SIMULATOR',  arch: 'x86_64',   sdk: 'iphonesimulator',deploy: '12.0' }
          - { platform: 'SIMULATOR',  arch: 'arm64',    sdk: 'iphonesimulator',deploy: '12.0' }
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode SDK availability
        run: xcodebuild -showsdks | grep -E 'iphone|iphonesimulator' || true

      - name: Configure CMake (iOS)
        run: |
          cmake -S . -B build-ios \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=build-ios/install \
              -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-iOS.cmake \
              -DIOS_PLATFORM=${{ matrix.sdk.platform }} \
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.sdk.arch }} \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.sdk.arch }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.sdk.deploy }} \
              -DIPHONEOS_DEPLOYMENT_TARGET=${{ matrix.sdk.deploy }} \
              -DAIRPLAY2_BUILD_EXAMPLES=OFF

      - name: Build (iOS)
        run: cmake --build build-ios --config Release --parallel 3

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplay2lib-iOS-${{ matrix.sdk.platform }}-${{ matrix.sdk.arch }}
          path: |
            build-ios/libairplay2*
            build-ios/install/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Android NDK 交叉构建（三大常见 ABI）
  # ------------------------------------------------------------------
  android:
    name: Android ${{ matrix.abi }} (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: 'armeabi-v7a', api: 24 }
          - { abi: 'arm64-v8a',   api: 24 }
          - { abi: 'x86_64',      api: 24 }
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK & build tools
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          link-to-sdk: true

      - name: Configure CMake (Android)
        run: |
          export ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake -S . -B build-android \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=build-android/install \
              -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-Android.cmake \
              -DANDROID_ABI=${{ matrix.abi }} \
              -DANDROID_PLATFORM=android-${{ matrix.api }} \
              -DANDROID_NDK="${ANDROID_NDK}" \
              -DAIRPLAY2_BUILD_EXAMPLES=OFF

      - name: Build (Android)
        run: cmake --build build-android --config Release --parallel 3

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplay2lib-Android-${{ matrix.abi }}-api${{ matrix.api }}
          path: |
            build-android/libairplay2*
            build-android/install/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Linux ARM64 (aarch64) 交叉构建
  # ------------------------------------------------------------------
  linux-arm64:
    name: Linux aarch64 (cross GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake ninja-build \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure CMake (aarch64 cross)
        run: |
          cmake -S . -B build-arm64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=build-arm64/install \
              -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-Linux-aarch64.cmake

      - name: Build (aarch64 cross)
        run: |
          set -o pipefail
          cmake --build build-arm64 --config Release --parallel 3 2>&1 | tee build-log-aarch64.txt

      - name: Upload aarch64 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-aarch64
          path: build-log-aarch64.txt
          if-no-files-found: ignore

      - name: Verify ELF architecture
        run: |
          file build-arm64/libairplay2.a 2>/dev/null || true
          # 若有共享库，也可检测 .so
          find build-arm64 -name "*.a" -o -name "*.so*" | while read f; do
              echo "$f ->"; file "$f"; done

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplay2lib-Linux-aarch64
          path: |
            build-arm64/libairplay2*
            build-arm64/install/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Linux 内存 + 未定义行为消毒（额外的质量保障）
  # ------------------------------------------------------------------
  sanitize-linux:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    needs: [ desktop ]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure (Sanitizers)
        run: |
          cmake -S . -B build-san \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
              -DAIRPLAY2_BUILD_EXAMPLES=ON
      - name: Build Sanitizers
        run: cmake --build build-san --parallel 3
