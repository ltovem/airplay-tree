// AirPlay Mirror —— app 模块 build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.airplay2.mirror'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.airplay2.mirror'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'

        externalNativeBuild {
            cmake {
                // 静态链接 C++ STL，避免设备上找 libc++_shared.so
                arguments '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Debug'
                cppFlags '-std=c++17'
                // 仅构建 arm64-v8a（小米平板等现代设备）
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // 使用 local.properties 里 cmake.dir=/usr/local 的系统 CMake
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}
